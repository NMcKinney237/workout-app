<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Posture Reset</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Posture Reset">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
button, a, label, summary, .dial { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
/* Layout: single-column phone app. Bottom tab bar, card list of routines, full-screen guided player sheet. */
:root {
  --bg: #EEF2F0;
  --surface: #FFFFFF;
  --surface-2: #E2E9E6;
  --ink: #15242A;
  --muted: #56676C;
  --line: #CCD7D3;
  --spruce: #2B6A5D;
  --spruce-soft: #D3E6E0;
  --ochre: #B9831F;
  --ochre-soft: #F3E4C4;
  --warn: #A9442F;
  --on-accent: #FFFFFF;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1618; --surface: #162125; --surface-2: #1E2C31; --ink: #E3ECE9; --muted: #93A6A6;
    --line: #2A3B40; --spruce: #6EC1AC; --spruce-soft: #1C3A35; --ochre: #E6B75A; --ochre-soft: #3A2F18;
    --warn: #E58A73; --on-accent: #0E1618; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1618; --surface: #162125; --surface-2: #1E2C31; --ink: #E3ECE9; --muted: #93A6A6;
  --line: #2A3B40; --spruce: #6EC1AC; --spruce-soft: #1C3A35; --ochre: #E6B75A; --ochre-soft: #3A2F18;
  --warn: #E58A73; --on-accent: #0E1618; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--spruce); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.view { display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.hdr h1 { font-size: 32px; font-weight: 800; letter-spacing: -.01em; }
.hdr p { margin: 6px 0 0; color: var(--muted); max-width: 40ch; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.day.today { border-color: var(--spruce); box-shadow: inset 0 0 0 1px var(--spruce); }
.day b { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.day span { font-family: var(--f-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--spruce); }

/* suggested */
.suggest { background: var(--spruce); color: var(--on-accent); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.suggest .eyebrow { color: inherit; opacity: .8; }
.suggest h2 { font-size: 26px; font-weight: 800; }
.suggest p { margin: 0; opacity: .9; }
.suggest .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; font-size: 16px; min-height: 48px; }
.btn-light { background: var(--surface); color: var(--ink); }
.btn-primary { background: var(--spruce); color: var(--on-accent); }
.btn-ghost { background: transparent; border: 1.5px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.suggest .chip { background: rgba(255,255,255,.18); color: inherit; }

/* routine cards */
.list { display: flex; flex-direction: column; gap: 10px; }
.routine {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; width: 100%;
}
.routine h3 { font-size: 19px; font-weight: 700; }
.routine p { grid-column: 1; margin: 0; color: var(--muted); font-size: 14px; }
.routine .meta { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.routine .mins { font-family: var(--f-mono); font-size: 14px; color: var(--muted); }
.go { width: 40px; height: 40px; border-radius: 50%; background: var(--spruce-soft); color: var(--spruce); display: grid; place-items: center; }
.done-tag { font-size: 12px; font-weight: 700; color: var(--spruce); letter-spacing: .04em; text-transform: uppercase; }

/* exercise library */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; min-height: 40px; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
details.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.ex summary { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 14px 16px; cursor: pointer; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary h3 { font-size: 18px; font-weight: 700; }
details.ex summary small { grid-column: 1; color: var(--muted); font-size: 14px; }
details.ex summary .plus { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-family: var(--f-mono); font-size: 20px; color: var(--muted); transition: transform .2s; }
details.ex[open] summary .plus { transform: rotate(45deg); }
.ex-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }

/* form detail (shared with player) */
.form-block { display: flex; flex-direction: column; gap: 6px; }
.form-block h4 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.form-block ol, .form-block ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.cues li::marker { color: var(--spruce); }
.mistakes li::marker { color: var(--warn); }
.feel { background: var(--spruce-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.feel b { color: var(--spruce); }
.easier { font-size: 14px; color: var(--muted); }
.easier b { color: var(--ink); }

/* plan */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { font-size: 20px; font-weight: 700; }
.card p { margin: 0; }
.sched { width: 100%; border-collapse: collapse; font-size: 15px; }
.sched td { padding: 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
.sched tr:first-child td { border-top: 0; }
.sched td:first-child { width: 56px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding-top: 12px; }
.sched td small { display: block; color: var(--muted); }
.cause { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cause > div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.cause b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.tight { color: var(--warn); }
.weak { color: var(--spruce); }
.card ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.note { font-size: 13px; color: var(--muted); }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--spruce); }

/* player */
.player {
  position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.p-top {
  display: flex; align-items: center; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-top .x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.p-top .t { flex: 1; min-width: 0; }
.p-top .t div { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-top .t small { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.progress { height: 4px; background: var(--surface-2); margin-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--spruce); transition: width .3s; }
.p-body {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; max-width: 560px; width: 100%; margin: 0 auto;
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-name { font-size: 30px; font-weight: 800; }
.p-sub { display: flex; gap: 8px; flex-wrap: wrap; }
.side-tag { background: var(--ochre-soft); color: var(--ochre); font-weight: 700; }
.dial { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
.dial .big { font-family: var(--f-mono); font-weight: 600; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.dial .big.reps { font-family: var(--f-display); font-weight: 800; }
.dial small { color: var(--muted); font-size: 14px; }
.dial.running .big { color: var(--ochre); }
.rest-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.rest-screen .big { font-family: var(--f-mono); font-size: 80px; font-weight: 600; color: var(--ochre); font-variant-numeric: tabular-nums; line-height: 1; }
.rest-screen p { margin: 0; color: var(--muted); }
.p-actions {
  display: grid; grid-template-columns: 56px 1fr 56px; gap: 10px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line); background: var(--surface); max-width: 100%;
}
.p-actions .nav { height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.p-actions .nav:disabled { opacity: .35; }
.p-actions .main { height: 56px; border-radius: 999px; border: 0; background: var(--spruce); color: var(--on-accent); font-weight: 700; font-size: 17px; }
.p-actions .main.pause { background: var(--ochre); color: var(--on-accent); }
.finish { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
.finish h2 { font-size: 34px; font-weight: 800; }
.finish p { margin: 0; color: var(--muted); max-width: 32ch; }
.check { width: 84px; height: 84px; border-radius: 50%; background: var(--spruce-soft); color: var(--spruce); display: grid; place-items: center; }

/* nutrition */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; align-self: flex-start; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.setup { gap: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label, .weigh label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fld input, .fld select, .search input, .custom-row input, .weigh input {
  width: 100%; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 44px; }
.pair { display: flex; align-items: center; gap: 6px; }
.pair span, .unit { color: var(--muted); font-size: 14px; }
.goals { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.goals legend { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.goal { position: relative; display: block; cursor: pointer; }
.goal input { position: absolute; opacity: 0; }
.goal span { display: flex; flex-direction: column; gap: 2px; height: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); }
.goal small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.goal input:checked + span { border-color: var(--spruce); background: var(--spruce-soft); }
.goal input:focus-visible + span { outline: 2px solid var(--spruce); outline-offset: 2px; }
.preview { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--spruce); color: var(--on-accent); border-radius: 14px; padding: 14px 16px; }
.preview .note { color: inherit; opacity: .9; }
.pv-main { display: flex; flex-direction: column; }
.pv-main b { font-family: var(--f-display); font-size: 36px; font-weight: 800; line-height: 1; }
.pv-main span { font-size: 13px; opacity: .85; }
.pv-side { display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-family: var(--f-mono); }
.daynav { display: flex; align-items: center; justify-content: space-between; }
.daynav .x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.daynav .x:disabled { opacity: .35; }
.daynav b { font-family: var(--f-display); font-size: 18px; }
.pro-card { flex-direction: row; align-items: center; gap: 16px; flex-wrap: wrap; }
.ring-wrap { position: relative; width: 128px; height: 128px; flex: none; }
.ring { width: 128px; height: 128px; }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 12; }
.ring-fg { fill: none; stroke: var(--ochre); stroke-width: 12; stroke-linecap: round; transition: stroke-dasharray .4s; }
.ring-fg.hit { stroke: var(--spruce); }
.ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-num b { font-family: var(--f-mono); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.ring-num span { font-size: 12px; color: var(--muted); }
.pro-side { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.hit-chip { background: var(--spruce-soft); color: var(--spruce); font-weight: 700; }
.kcal { display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: var(--muted); }
.kcal b { font-family: var(--f-mono); color: var(--ink); font-weight: 600; }
.kbar { width: 100%; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.kbar i { display: block; height: 100%; background: var(--spruce); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.foods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.food { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; min-height: 48px; font-size: 13px; line-height: 1.3; }
.food b { font-family: var(--f-mono); color: var(--spruce); flex: none; }
.food span { min-width: 0; }
.food small { display: block; color: var(--muted); font-size: 11px; }
.results { display: flex; flex-direction: column; gap: 6px; }
.search { display: flex; flex-direction: column; gap: 6px; }
.search-row { display: flex; gap: 8px; align-items: center; }
.search-row input { flex: 1; }
.search-row .btn { min-height: 44px; padding: 8px 16px; }
.custom summary { cursor: pointer; font-weight: 600; color: var(--spruce); }
.custom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.custom-row #cf-name { grid-column: 1 / -1; }
.entry { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 8px; border-top: 1px solid var(--line); }
.entry:first-of-type { border-top: 0; }
.en-main { min-width: 0; display: flex; flex-direction: column; }
.en-main b { font-weight: 600; font-size: 15px; }
.en-main small { color: var(--muted); font-size: 13px; }
.en-q { display: flex; align-items: center; gap: 6px; flex: none; font-family: var(--f-mono); font-size: 14px; }
.en-q .step { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; }
.chart-wrap { overflow-x: auto; }
.week-chart { width: 100%; min-width: 280px; height: auto; display: block; }
.week-chart .bar { fill: var(--ochre); opacity: .75; }
.week-chart .bar.hit { fill: var(--spruce); opacity: 1; }
.week-chart .bar-val { fill: var(--ink); font-family: var(--f-mono); font-size: 10px; text-anchor: middle; }
.week-chart .bar-day { fill: var(--muted); font-size: 10px; font-weight: 700; text-anchor: middle; }
.week-chart .target-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.week-chart .target-label { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.meals { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.meals b { font-family: var(--f-mono); color: var(--spruce); white-space: nowrap; }
.meals li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.meals .chip { justify-content: center; }
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.plan-grid div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.plan-grid span { font-size: 12px; color: var(--muted); }
.plan-grid b { font-family: var(--f-mono); font-size: 17px; }
.weigh { display: flex; flex-direction: column; gap: 6px; }
.why summary { list-style: none; cursor: pointer; }
.why summary::-webkit-details-marker { display: none; }
.why summary h2::after { content: " +"; color: var(--muted); font-family: var(--f-mono); }
.why[open] summary h2::after { content: " \2212"; }
.pt-card { flex-direction: row; justify-content: space-between; align-items: center; text-align: left; width: 100%; }
.pt-card > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.pt-card b { font-family: var(--f-mono); font-size: 20px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

label.btn { display: inline-flex; align-items: center; cursor: pointer; }
.dial[data-act] { cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .media img.f2 { animation: none; opacity: 0; }
}

  function lerpPose(d, t) {
    const a = d.poses[0], b = Object.assign({}, a, d.poses[1] || {}), out = {};
    for (const k in b) out[k] = b[k].map((v, i) => (a[k] ? a[k][i] : v) + (v - (a[k] ? a[k][i] : v)) * t);
    return out;
  }

      else if (p[0] === "line") h += `<line class="dg-prop" x1="${p[1]}" y1="${p[2]}" x2="${p[3]}" y2="${p[4]}"/>`;
      else if (p[0] === "dash") h += `<line class="dg-dash" x1="${p[1]}" y1="${p[2]}" x2="${p[3]}" y2="${p[4]}"/>`;
      else if (p[0] === "rect") h += `<rect class="${p[5]}" x="${p[1]}" y="${p[2]}" width="${p[3]}" height="${p[4]}" rx="4"/>`;
      else if (p[0] === "ball") h += `<circle class="dg-ball" cx="${p[1]}" cy="${p[2]}" r="${p[3]}"/>`;

    if (P.ell) h += `<ellipse class="dg-accent" cx="${P.ell[0].toFixed(1)}" cy="${P.ell[1].toFixed(1)}" rx="${P.ell[2].toFixed(1)}" ry="${P.ell[3].toFixed(1)}"/>`;

  // Daily routine goals: the day's main routine, plus 3 Desk Resets on weekdays. Home A/B count for Gym A/B.
  const SWAPS = { "gym-a": ["strength-a"], "gym-b": ["strength-b"] };
  function dayGoals(d) {
    const dow = d.getDay(), plan = WEEK[dow], list = log[dkey(d)] || [];
    const count = id => list.filter(x => x === id || (SWAPS[id] || []).includes(x)).length;
    const goals = [{ id: plan.main, name: R[plan.main].name.split(":")[0], need: 1 }];
    if (dow >= 1 && dow <= 5) goals.push({ id: "desk", name: "Desk Reset", need: 3 });
    goals.forEach(g => { g.got = count(g.id); g.done = Math.min(g.got, g.need); });
    return { goals, done: goals.reduce((a, g) => a + g.done, 0), total: goals.reduce((a, g) => a + g.need, 0) };
  }
  function weekGym() {
    const now = new Date(), mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    let got = 0;
    for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); got += (log[dkey(d)] || []).filter(x => /^(gym-|strength-)/.test(x)).length; }
    return { got, need: 4 };
  }

  function showView(v) {
    views.forEach(n => {
      document.getElementById("view-" + n).hidden = n !== v;
      document.getElementById("tab-" + n).setAttribute("aria-selected", String(n === v));
    });
    if (v === "today") renderToday();
    if (v === "progress") renderProgress();
    if (v === "fuel") { nutDay = dkey(new Date()); renderNutrition(); }
    window.scrollTo(0, 0);
    try { sessionStorage.setItem("pr-view", v); } catch (e) {}
  }
  document.querySelector(".tabbar").addEventListener("click", e => {
    const b = e.target.closest("[data-view]"); if (b) showView(b.dataset.view);
  });
  document.getElementById("view-library").addEventListener("click", e => {
    const b = e.target.closest("[data-filter]"); if (b) { filter = b.dataset.filter; renderLibrary(); }
  });
  document.querySelector(".app").addEventListener("click", e => {
    const g = e.target.closest("[data-goto]"); if (g) return showView(g.dataset.goto);
    const b = e.target.closest("[data-start]"); if (b) openPlayer(b.dataset.start);
  });

  // ---------- Player ----------
  // Flow modeled on Feeel (voice + countdown cues, next-up during rest) and wger/Liftosaur (set logging, rest +/-15s, jump list, summary).
  const P = document.getElementById("player");
  const LKEY = "posture-reset-lifts-v1", PKEY = "posture-reset-prefs-v2";
  function loadJSON(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  let lifts = loadJSON(LKEY, {});
  // Sound (voice + beeps) is off until the user turns it on. Older saved prefs only carry over the weight unit.
  const prefs = Object.assign({ sound: false, unit: (loadJSON("posture-reset-prefs-v1", {}).unit) || "lb" }, loadJSON(PKEY, {}));
  let steps = [], idx = 0, routine = null, wakeLock = null, audio = null, clock = null, session = null, hold = "idle", closeArmed = 0;

  const isLogged = st => st.kind === "ex" && st.unit === "reps" && EX[st.id].tags.includes("gym");
  const icons2 = {
    list: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
    voiceOn: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
    voiceOff: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
    tick: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };

  function buildSteps(r) {
    const out = [];
    r.items.forEach((it, i) => {
      const [id, sets, amt, unit, side, rest, note] = it;
      for (let s = 1; s <= sets; s++) {
        (side ? ["Left", "Right"] : [null]).forEach(sd => out.push({ kind: "ex", id, set: s, sets, amt, unit, side: sd, note, item: i }));
        if (rest && s < sets) out.push({ kind: "rest", secs: rest, item: i });
      }
    });
    return out;
  }

  // ---- feedback: beeps, vibration, voice ----
  function beep(freq, dur) {
    if (!prefs.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.start(); o.stop(audio.currentTime + dur + 0.05);
    } catch (e) {}
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function speak(text) {
    if (!prefs.sound) return;
    try { const s = window.speechSynthesis; if (!s) return; s.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.03; s.speak(u); } catch (e) {}
  }
  async function lockScreen() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; } }
  function unlockScreen() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

  // ---- countdown clock with pause / adjust ----
  function clockStart(secs, onTick, onDone) {
    clockStop();
    clock = { end: Date.now() + secs * 1000, total: secs, left: secs, last: -1, paused: false, onTick, onDone };
    clock.iv = setInterval(clockTick, 100); clockTick();
  }
  function clockTick() {
    if (!clock || clock.paused) return;
    const ms = clock.end - Date.now(), left = Math.max(0, Math.ceil(ms / 1000));
    if (left !== clock.last) { clock.last = left; clock.left = left; clock.onTick(left, clock.total); }
    if (ms <= 0) { const done = clock.onDone; clockStop(); done(); }
  }
  function clockStop() { if (clock) clearInterval(clock.iv); clock = null; }
  function clockPause() { if (clock && !clock.paused) { clock.left = Math.max(0, (clock.end - Date.now()) / 1000); clock.paused = true; } }
  function clockResume() { if (clock && clock.paused) { clock.paused = false; clock.end = Date.now() + clock.left * 1000; clock.last = -1; } }
  function clockAdd(s) {
    if (!clock) return;
    clock.end = Math.max(Date.now() + 1000, clock.end + s * 1000);
    clock.total = Math.max(1, clock.total + s); clock.last = -1; clockTick();
  }
  const fmt = s => s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : String(s);

  // ---- open / close ----
  function openPlayer(id) {
    routine = R[id]; steps = buildSteps(routine); idx = 0; hold = "idle"; clockStop();
    session = { start: Date.now(), sets: 0, done: 0, volume: 0, lifts: {} };
    P.hidden = false; document.body.style.overflow = "hidden";
    lockScreen(); beep(520, 0.05); renderStep();
  }
  function closePlayer() {
    clockStop(); unlockScreen(); try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
    P.hidden = true; document.body.style.overflow = ""; renderToday();
  }

  // ---- helpers ----
  function stepDose(st) {
    return st.unit === "sec" ? st.amt + " seconds" : st.amt + " reps";
  }
  function firstStepOf(i) { return steps.findIndex(s => s.item === i); }
  function lastEntry(id) {
    const list = (lifts[id] || []).filter(x => x.s !== session.start);
    return list[list.length - 1] || null;
  }
  function topBar(st) {
    const n = routine.items.length;
    return `
      <div class="p-top">
        <button class="x" data-act="close" aria-label="End workout">${icon.x}</button>
        <div class="t"><div id="p-title">${esc(routine.name)}</div><small>${st ? `Exercise ${st.item + 1} of ${n}` : ""}</small></div>
        <button class="x" data-act="voice" aria-pressed="${prefs.sound}" aria-label="Sound ${prefs.sound ? "on" : "off"}">${prefs.sound ? icons2.voiceOn : icons2.voiceOff}</button>
        <button class="x" data-act="list" aria-label="All exercises in this routine">${icons2.list}</button>
      </div>
      <div class="progress" aria-hidden="true"><i style="width:${Math.round((idx / steps.length) * 100)}%"></i></div>`;
  }
  function actions(mainLabel, mainAct, mainCls) {
    return `<div class="p-actions">
        <button class="nav" data-act="prev" aria-label="Previous" ${idx === 0 ? "disabled" : ""}>${icon.prev}</button>
        <button class="main ${mainCls || ""}" data-act="${mainAct}" id="main-btn">${mainLabel}</button>
        <button class="nav" data-act="next" aria-label="Skip">${icon.next}</button>
      </div>`;
  }

  // ---- render ----
  function renderStep() {
    hold = "idle";
    if (idx >= steps.length) return renderFinish();
    return steps[idx].kind === "rest" ? renderRest(steps[idx]) : renderEx(steps[idx]);
  }

  function renderRest(st) {
    const nx = steps[idx + 1];
    const e = nx ? EX[nx.id] : null;
    P.innerHTML = topBar(st) + `
      <div class="p-body"><div class="rest-screen">
        <p class="eyebrow">Rest</p>
        <div class="big" data-count>${fmt(st.secs)}</div>
        <div class="rest-bar" aria-hidden="true"><i data-fill style="width:100%"></i></div>
        <div class="rest-adj">
          <button class="pill-btn" data-act="minus15">&minus;15s</button>
          <button class="pill-btn" data-act="plus15">+15s</button>
        </div>
        ${e ? `<div class="upnext">
          <p class="eyebrow">Up next</p>
          <h3>${esc(e.name)}</h3>
          <div class="p-sub">
            ${nx.sets > 1 ? `<span class="chip">Set ${nx.set} of ${nx.sets}</span>` : ""}
            ${nx.side ? `<span class="chip side-tag">${nx.side} side</span>` : ""}
            <span class="chip">${stepDose(nx)}</span>
          </div>
        </div>` : ""}
      </div></div>` + actions("Skip rest", "next");
    if (e) speak("Rest. Next up, " + (nx.set > 1 ? "set " + nx.set + ". " : e.name + ". ") + (nx.side ? nx.side + " side." : ""));
    clockStart(st.secs, (left, total) => {
      const c = P.querySelector("[data-count]"); if (c) c.textContent = fmt(left);
      const f = P.querySelector("[data-fill]"); if (f) f.style.width = Math.min(100, (left / total) * 100) + "%";
      if (left > 0 && left <= 3) beep(600, 0.08);
    }, () => { beep(880, 0.35); buzz([200, 100, 200]); idx++; renderStep(); });
  }

  function renderEx(st) {
    const e = EX[st.id], timed = st.unit === "sec", logged = isLogged(st);
    let logBlock = "";
    if (logged) {
      const prev = lastEntry(st.id);
      const mine = session.lifts[st.id] || [];
      const lastSet = mine[mine.length - 1];
      const prevSet = prev ? (prev.sets[st.set - 1] || prev.sets[prev.sets.length - 1]) : null;
      const w = lastSet ? lastSet.w : prevSet ? prevSet.w : "";
      const r = st.amt;
      const step = prefs.unit === "kg" ? 2.5 : 5;
      logBlock = `
        ${prev ? `<p class="last">Last time (${esc(prev.d.slice(5).replace("-", "/"))}): <b>${prev.sets.map(x => x.r + " x " + x.w).join(", ")}</b> ${esc(prev.u)}</p>` : `<p class="last">First time logging this. Pick a weight that leaves about 2 reps in the tank.</p>`}
        <div class="logset">
          <div class="field">
            <label for="in-reps">Reps</label>
            <div class="ctl"><button class="step" data-act="rp-" aria-label="One fewer rep">&minus;</button><input id="in-reps" type="number" inputmode="numeric" min="0" value="${r}"><button class="step" data-act="rp+" aria-label="One more rep">+</button></div>
          </div>
          <div class="field">
            <label for="in-wt"><span>Weight</span><button class="unit-btn" data-act="unit" aria-label="Switch units">${prefs.unit}</button></label>
            <div class="ctl"><button class="step" data-act="wt-" data-step="${step}" aria-label="Less weight">&minus;</button><input id="in-wt" type="number" inputmode="decimal" min="0" step="${step}" value="${w}" placeholder="0"><button class="step" data-act="wt+" data-step="${step}" aria-label="More weight">+</button></div>
          </div>
        </div>`;
    }
    const upNext = (() => { for (let j = idx + 1; j < steps.length; j++) if (steps[j].kind === "ex" && steps[j].id !== st.id) return EX[steps[j].id].name; return null; })();
    P.innerHTML = topBar(st) + `
      <div class="p-body">
        <div style="display:flex;flex-direction:column;gap:8px">
          <h2 class="p-name">${esc(e.name)}</h2>
          <div class="p-sub">
            ${st.sets > 1 ? `<span class="chip">Set ${st.set} of ${st.sets}</span>` : ""}
            ${st.side ? `<span class="chip side-tag">${st.side} side</span>` : ""}
            ${st.note ? `<span class="chip">${esc(st.note)}</span>` : ""}
          </div>
        </div>
        ${mediaHTML(st.id)}
        <div class="dial" id="dial"${timed ? ' data-act="toggle" role="button" tabindex="0" aria-label="Tap to start or pause the timer"' : ""}>
          <span class="lead" data-lead hidden>Get set</span>
          <div class="big${timed ? "" : " reps"}" ${timed ? "data-count" : ""}>${timed ? fmt(st.amt) : st.amt}</div>
          <small>${timed ? "seconds" : "reps"}</small>
        </div>
        ${logBlock}
        ${formHTML(e)}
        ${upNext ? `<p class="note">After this: ${esc(upNext)}</p>` : ""}
      </div>` + actions(timed ? "Start" : logged ? "Log set" : "Done, next", timed ? "toggle" : logged ? "log" : "done");
    for (let j = idx + 1; j < steps.length; j++) {
      if (steps[j].kind === "ex" && steps[j].id !== st.id) { const ph = PHOTO[steps[j].id]; if (ph) { new Image().src = "img/" + ph[0] + "_0.jpg"; new Image().src = "img/" + ph[0] + "_1.jpg"; } break; }
    }
    const sideTxt = st.side ? st.side + " side. " : "";
    speak(st.set > 1 || (st.side === "Right") ? (st.set > 1 ? "Set " + st.set + ". " : "") + sideTxt + (timed ? st.amt + " seconds." : "")
      : e.name + ". " + sideTxt + stepDose(st) + (st.sets > 1 ? ", " + st.sets + " sets." : "."));
  }

  function runHold(st) {
    const dial = P.querySelector("#dial"), btn = P.querySelector("#main-btn"), lead = P.querySelector("[data-lead]");
    hold = "lead"; btn.textContent = "Cancel"; btn.classList.add("pause"); lead.hidden = false;
    const big = P.querySelector("[data-count]");
    clockStart(3, left => { if (left > 0) { big.textContent = left; beep(600, 0.08); } }, () => {
      hold = "run"; lead.hidden = true; btn.textContent = "Pause"; dial.classList.add("running"); beep(880, 0.2); buzz(80);
      let half = false;
      clockStart(st.amt, (left, total) => {
        big.textContent = fmt(left);
        if (!half && total >= 20 && left === Math.floor(total / 2)) { half = true; speak("Halfway"); }
        if (left > 0 && left <= 3) beep(600, 0.08);
      }, () => { beep(880, 0.35); buzz([200, 100, 200]); session.done++; idx++; renderStep(); });
    });
  }

  function renderSheet() {
    const cur = steps[idx] ? steps[idx].item : routine.items.length;
    const rows = routine.items.map((it, i) => {
      const lastIdx = steps.map(s => s.item).lastIndexOf(i);
      const state = i === cur ? "cur" : idx > lastIdx ? "done" : "";
      return `<button class="jump ${state}" data-jump="${i}"><span class="st">${state === "done" ? icons2.tick : ""}</span><span>${esc(EX[it[0]].name)}</span><small>${doseText(it)}</small></button>`;
    }).join("");
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="sheet-backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-label="Exercises in this routine"><p class="eyebrow">Jump to</p>${rows}</div>`;
    wrap.dataset.sheet = "1";
    P.appendChild(wrap);
  }

  function renderFinish() {

    const k = dkey(new Date());

    const mins = Math.max(1, Math.round((Date.now() - session.start) / 60000));
    const stats = [[mins, "minutes"], [session.done, "steps done"]];
    if (session.sets) stats.push([session.sets, "sets logged"]);
    if (session.volume) stats.push([Math.round(session.volume).toLocaleString(), prefs.unit + " moved"]);
    P.innerHTML = topBar(null) + `
      <div class="p-body"><div class="finish">
        <div class="check">${icon.check}</div>
        <h2>Done</h2>
        <div class="stats">${stats.map(s => `<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div>
        <p>${esc(routine.name)} is logged for today. ${routine.id === "desk" ? "Do it again in an hour or so." : "Stand up and walk for a minute."}</p>
        <button class="btn btn-primary" data-act="close">Back to today</button>
      </div></div>`;
    P.querySelector(".progress i").style.width = "100%";
    beep(660, 0.2); setTimeout(() => beep(990, 0.3), 220); speak("Workout complete. Nice work.");

  }

  function logSet() {
    const st = steps[idx];
    const r = parseInt(P.querySelector("#in-reps").value, 10) || 0;
    const w = parseFloat(P.querySelector("#in-wt").value) || 0;
    const list = (session.lifts[st.id] = session.lifts[st.id] || []);
    list.push({ r, w });
    session.sets++; session.done++; session.volume += r * w;
    lifts[st.id] = (lifts[st.id] || []).filter(x => x.s !== session.start)
      .concat({ s: session.start, d: dkey(new Date()), u: prefs.unit, sets: list.slice() }).slice(-12);

  }

  function toast(text) {
    const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
    P.appendChild(t); setTimeout(() => t.remove(), 2500);
  }

  P.addEventListener("click", e => {
    const j = e.target.closest("[data-jump]");
    if (j) { clockStop(); idx = firstStepOf(+j.dataset.jump); return renderStep(); }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, st = steps[idx];
    switch (act) {
      case "close":
        if (idx > 0 && idx < steps.length && Date.now() - closeArmed > 2500) { closeArmed = Date.now(); return toast("Tap X again to end the workout"); }

      case "toggle": {
        beep(520, 0.05);
        const dial = P.querySelector("#dial"), mb = P.querySelector("#main-btn");
        if (hold === "idle") return runHold(st);
        if (hold === "lead") { if (b !== mb) return; clockStop(); return renderEx(st); }
        if (hold === "run") { clockPause(); hold = "paused"; mb.textContent = "Resume"; mb.classList.remove("pause"); dial.classList.remove("running"); return; }
        if (hold === "paused") { clockResume(); hold = "run"; mb.textContent = "Pause"; mb.classList.add("pause"); dial.classList.add("running"); return; }
      }
    }
  });

  document.addEventListener("visibilitychange", () => { if (!P.hidden && document.visibilityState === "visible") lockScreen(); });
  document.addEventListener("keydown", e => {
    if (P.hidden) return;
    if (e.key === "Escape") { const s = P.querySelector("[data-sheet]"); if (s) s.remove(); else closePlayer(); }
  });

  // ---------- Nutrition (protein first) ----------
  // Setup modeled on MyFitnessPal/MacroFactor: body stats + activity + goal -> targets. Logging: quick add, common/recent foods, Open Food Facts search.
  const NKEY = "workout-app-nutrition-v1";
  nutReady = true;
  const nut = Object.assign({ profile: null, days: {}, weights: {}, foods: [] }, loadJSON(NKEY, {}));
  const saveNut = () => saveJSON(NKEY, nut);
  let nutDay = dkey(new Date()), nutEditing = false, searchResults = [], searchState = "";

  const ACTIVITY = [
    [1.2, "Desk job, little exercise"],
    [1.375, "Desk job + 2 to 3 workouts a week"],
    [1.55, "Desk job + 4 to 5 workouts a week"],
    [1.725, "Active job or daily hard training"]
  ];
  const GOALS = {
    lose: { name: "Lose fat", kcal: 0.80, p: 2.2, lo: 1.8, hi: 2.7, rate: "About 0.5 to 1% of body weight per week", why: "Protein is highest here. In a calorie deficit it's what keeps muscle on while fat comes off." },
    gain: { name: "Gain muscle, stay lean", kcal: 1.06, p: 2.0, lo: 1.6, hi: 2.2, rate: "About 0.25% of body weight per week", why: "A small surplus with high protein. Slow gain that's mostly muscle." },

    maintain: { name: "Maintain", kcal: 1.0, p: 1.8, lo: 1.6, hi: 2.2, rate: "Weight holds steady", why: "Enough protein to keep building strength while weight stays put." }
  };
  // Approximate values for common US servings: [name, protein g, kcal]
  const FOODS = [
    ["Chicken breast, 4 oz cooked", 35, 185], ["Whey protein, 1 scoop", 24, 120], ["Greek yogurt, 1 cup nonfat", 23, 130],
    ["Eggs, 2 large", 12, 140], ["Egg whites, 1 cup", 26, 125], ["Cottage cheese, 1 cup low-fat", 26, 180],
    ["Lean ground beef, 4 oz cooked", 28, 240], ["Salmon, 4 oz cooked", 28, 230], ["Tuna, 1 can drained", 28, 130],
    ["Turkey deli meat, 3 oz", 15, 90], ["Milk, 1 cup 2%", 8, 120], ["Protein bar", 20, 220],
    ["Beef jerky, 1 oz", 10, 80], ["Firm tofu, 1/2 block", 20, 180], ["Lentils, 1 cup cooked", 18, 230], ["Shrimp, 4 oz cooked", 27, 120]
  ];
  const MEAL_IDEAS = [
    ["Breakfast", [["Greek yogurt, 1 cup nonfat", 23], ["Whey protein, 1 scoop", 24]]],
    ["Breakfast", [["Eggs, 2 large", 12], ["Egg whites, 1 cup", 26]]],
    ["Lunch", [["Chicken breast, 4 oz cooked", 35], ["Milk, 1 cup 2%", 8]]],
    ["Lunch", [["Tuna, 1 can drained", 28], ["Cottage cheese, 1/2 cup", 13]]],
    ["Dinner", [["Salmon, 4 oz cooked", 28], ["Lentils, 1 cup cooked", 18]]],
    ["Snack", [["Cottage cheese, 1 cup low-fat", 26], ["Beef jerky, 1 oz", 10]]]
  ];

  function calcTargets(p) {
    const g = GOALS[p.goal] || GOALS.maintain;
    const m = p.heightCm / 100, bmi = p.weightKg / (m * m);
    // For higher body fat, base protein on the weight at BMI 25 so the target isn't inflated by fat mass.
    const adjusted = bmi > 27;
    const refKg = adjusted ? 25 * m * m : p.weightKg;
    const sexAdj = p.sex === "m" ? 5 : p.sex === "f" ? -161 : -78;
    const bmr = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + sexAdj; // Mifflin-St Jeor
    const tdee = bmr * p.activity;
    const r5 = x => Math.round(x / 5) * 5;
    const protein = r5(g.p * refKg);
    return { g, bmi, adjusted, refKg, bmr, tdee, kcal: Math.round(tdee * g.kcal / 10) * 10,
      protein, lo: r5(g.lo * refKg), hi: r5(g.hi * refKg), perMeal: r5(Math.max(0.4 * refKg, protein / 4)) };
  }
  const targets = () => nut.profile ? calcTargets(nut.profile) : null;
  const dayEntries = k => nut.days[k] || [];
  const dayTotals = k => dayEntries(k).reduce((a, e) => ({ p: a.p + e.p * e.q, k: a.k + e.k * e.q }), { p: 0, k: 0 });
  const proteinHit = k => { const t = targets(); return !!t && dayTotals(k).p >= t.protein; };
  const isImp = () => !nut.profile || nut.profile.units !== "met";
  const kgToDisp = kg => isImp() ? Math.round(kg / 0.45359 * 10) / 10 : Math.round(kg * 10) / 10;
  const wUnit = () => isImp() ? "lb" : "kg";

  function addEntry(name, p, k) {
    const list = nut.days[nutDay] = dayEntries(nutDay).slice();
    const same = list.find(e => e.n === name && e.p === p);
    if (same) same.q = Math.round((same.q + 1) * 10) / 10;
    else list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), n: name, p: Math.round(p * 10) / 10, k: Math.round(k || 0), q: 1 });
    saveNut(); buzz(30); renderNutrition();
  }

  function ring(val, target) {
    const r = 52, c = 2 * Math.PI * r, frac = Math.min(1, target ? val / target : 0);
    return `<svg class="ring" viewBox="0 0 128 128" aria-hidden="true">
      <circle cx="64" cy="64" r="${r}" class="ring-bg"/>
      ${frac > 0 ? `<circle cx="64" cy="64" r="${r}" class="ring-fg${frac >= 1 ? " hit" : ""}" stroke-dasharray="${(c * frac).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 64 64)"/>` : ""}
    </svg>`;
  }
  function weekChart(t) {
    const days = [], base = new Date(nutDay + "T12:00:00");
    for (let i = 6; i >= 0; i--) { const d = new Date(base); d.setDate(base.getDate() - i); days.push(d); }
    const vals = days.map(d => Math.round(dayTotals(dkey(d)).p));
    const max = Math.max(t.protein * 1.25, ...vals, 1), W = 300, H = 120, top = 14, bottom = 22, bw = 26;
    const y = v => top + (H - top - bottom) * (1 - v / max);
    const bars = days.map((d, i) => {
      const x = 18 + i * ((W - 36) / 6) - bw / 2, v = vals[i];
      return `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw}" height="${Math.max(0, H - bottom - y(v)).toFixed(1)}" rx="4" class="${v >= t.protein ? "bar hit" : "bar"}"/>
        ${v ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(y(v) - 4).toFixed(1)}" class="bar-val">${v}</text>` : ""}
        <text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" class="bar-day">${"SMTWTFS"[d.getDay()]}</text>`;
    }).join("");
    return `<svg class="week-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Protein for the last 7 days against a ${t.protein} gram target">
      <line x1="0" x2="${W}" y1="${y(t.protein).toFixed(1)}" y2="${y(t.protein).toFixed(1)}" class="target-line"/>
      <text x="${W - 2}" y="${(y(t.protein) - 4).toFixed(1)}" class="target-label" text-anchor="end">${t.protein} g</text>
      ${bars}</svg>`;
  }

            <div class="en-q"><button class="step" data-qty="${e.id}" data-d="-0.5" aria-label="Less">&minus;</button><span>${e.q}x</span><button class="step" data-qty="${e.id}" data-d="0.5" aria-label="More">+</button></div>

  async function runSearch(q) {
    const box = document.getElementById("food-results");
    if (!navigator.onLine) { searchState = '<p class="note">Search needs a connection. Common foods and quick add work offline.</p>'; box.innerHTML = searchState; return; }
    box.innerHTML = '<p class="note">Searching Open Food Facts...</p>';
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    try {
      const url = "https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&json=1&page_size=20&fields=product_name,brands,nutriments,serving_size,serving_quantity&search_terms=" + encodeURIComponent(q);
      const res = await fetch(url, { signal: ctl.signal });
      const data = await res.json();
      searchResults = (data.products || []).map(x => {
        const n = x.nutriments || {}, name = [x.product_name, (x.brands || "").split(",")[0]].filter(Boolean).join(" · ");
        if (!name || n.proteins_100g == null) return null;
        if (n.proteins_serving != null && x.serving_size) return { n: name, p: +n.proteins_serving, k: +(n["energy-kcal_serving"] || 0), per: x.serving_size };
        return { n: name + " (100 g)", p: +n.proteins_100g, k: +(n["energy-kcal_100g"] || 0), per: "100 g" };
      }).filter(Boolean).slice(0, 12);
      searchState = searchResults.length ? `<div class="results">${searchResults.map((r, i) => `<button class="food result" data-result="${i}"><span>${esc(r.n)}<small>per ${esc(r.per)} &middot; ${Math.round(r.k)} kcal</small></span><b>${Math.round(r.p * 10) / 10} g</b></button>`).join("")}</div><p class="note">From Open Food Facts, a crowd-sourced database. Check the label if a number looks off.</p>`
        : '<p class="note">No matches with protein info. Try a brand name, or add it as your own food.</p>';
    } catch (e) {
      searchState = '<p class="note">Search didn\'t respond. Try again in a moment, or add it as your own food.</p>';
    } finally { clearTimeout(timer); }
    const b2 = document.getElementById("food-results"); if (b2) b2.innerHTML = searchState;
  }

  const fuel = document.getElementById("view-fuel");

  // ---------- Progress ----------
  function streakDays() {
    const d = new Date(); let n = 0;
    if (!(log[dkey(d)] || []).length) d.setDate(d.getDate() - 1);
    while ((log[dkey(d)] || []).length) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function countSince(days) {
    let n = 0; const d = new Date();
    for (let i = 0; i < days; i++) { n += (log[dkey(d)] || []).length; d.setDate(d.getDate() - 1); }
    return n;
  }
  function sparkline(vals) {
    if (vals.length < 2) return "";
    const W = 120, H = 32, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const pts = vals.map((v, i) => [4 + (i * (W - 8)) / (vals.length - 1), H - 5 - ((v - lo) / span) * (H - 10)]);
    const line = pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${line}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3"/></svg>`;
  }
  function renderProgress() {
    const now = new Date(), y = now.getFullYear(), m = now.getMonth();
    const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), offset = (first.getDay() + 6) % 7;
    let cells = "";
    for (let i = 0; i < offset; i++) cells += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= days; d++) {
      const k = dkey(new Date(y, m, d)), list = log[k] || [];
      const isToday = d === now.getDate();
      const title = list.length ? list.map(id => R[id] ? R[id].name : id).join(", ") : "No sessions";
      const pro = proteinHit(k), future = d > now.getDate();
      cells += `<button class="cal-cell${list.length ? " on" : ""}${isToday ? " today" : ""}${pro ? " pro" : ""}" ${future ? "disabled" : `data-day="${k}"`} title="${esc(title)}" aria-label="${d}: ${esc(title)}${pro ? ", protein target hit" : ""}"><span>${d}</span>${list.length > 1 ? `<small>${list.length}</small>` : ""}</button>`;
    }
    const liftRows = Object.entries(lifts).filter(([id, h]) => EX[id] && h.length).map(([id, h]) => {
      const tops = h.map(x => Math.max(0, ...x.sets.map(s => s.w)));
      const last = h[h.length - 1];
      let best = null;
      h.forEach(x => x.sets.forEach(s => { if (!best || s.w > best.w || (s.w === best.w && s.r > best.r)) best = Object.assign({ u: x.u }, s); }));
      return `<div class="lift">
        <div class="lift-main"><h3>${esc(EX[id].name)}</h3>
          <p>Last (${esc(last.d.slice(5).replace("-", "/"))}): <b>${last.sets.map(s => s.r + " x " + s.w).join(", ")}</b> ${esc(last.u)}</p>
          <p>Best set: <b>${best.r} x ${best.w}</b> ${esc(best.u)} &middot; ${h.length} session${h.length > 1 ? "s" : ""}</p>
        </div>${sparkline(tops)}</div>`;
    }).join("");
    document.getElementById("view-progress").innerHTML = `
      <header class="hdr">
        <p class="eyebrow">Saved on this phone</p>
        <h1 id="h-progress">Progress</h1>
      </header>
      <div class="statrow">
        <div><b>${streakDays()}</b><span>day streak</span></div>
        <div><b>${countSince(7)}</b><span>sessions, 7 days</span></div>
        <div><b>${countSince(30)}</b><span>sessions, 30 days</span></div>
      </div>
      <div class="card">
        <h2>${now.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</h2>
        <div class="cal">${["M", "T", "W", "T", "F", "S", "S"].map(d => `<div class="cal-head">${d}</div>`).join("")}${cells}</div>
        <div class="legend"><span><i class="lg-work"></i>Workout</span><span><i class="lg-pro"></i>Protein target hit</span><span>Tap a day to see its food log</span></div>
      </div>
      <div class="card">
        <h2>Lifts</h2>
        ${liftRows || '<p class="note">Lifts you log in Gym A and Gym B show up here with your last session, best set and a weight trend.</p>'}
      </div>
      <div class="card">
        <h2>Backup</h2>
        <p class="note">Your history lives only on this phone. Save a backup now and then, and restore it if you switch phones or clear Safari data.</p>
        <div class="row-btns">
          <button class="btn btn-primary" data-backup="export">Save backup</button>
          <label class="btn btn-ghost" for="import-file">Restore backup</label>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
        <p class="note" id="backup-msg" role="status"></p>
      </div>`;
  }
  async function exportBackup() {
    const data = JSON.stringify({ app: "workout-app", version: 2, exported: new Date().toISOString(), log, lifts, prefs, nutrition: nut }, null, 1);
    const name = "workout-backup-" + dkey(new Date()) + ".json";
    const msg = document.getElementById("backup-msg");
    try {
      const file = new File([data], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); msg.textContent = "Backup ready. Save it to Files or iCloud Drive."; return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    msg.textContent = "Backup saved as " + name + ".";
  }
  function importBackup(file) {
    const msg = document.getElementById("backup-msg");
    file.text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || d.app !== "workout-app") throw new Error("not ours");
      Object.entries(d.log || {}).forEach(([k, v]) => { if (!log[k] || v.length > log[k].length) log[k] = v; });
      Object.entries(d.lifts || {}).forEach(([id, h]) => {
        const have = new Set((lifts[id] || []).map(x => x.s));
        lifts[id] = (lifts[id] || []).concat(h.filter(x => !have.has(x.s))).sort((a, b) => a.s - b.s).slice(-24);
      });
      if (d.nutrition) {
        const dn = d.nutrition;
        if (!nut.profile && dn.profile) nut.profile = dn.profile;
        Object.entries(dn.days || {}).forEach(([k, v]) => { if (!nut.days[k] || v.length > nut.days[k].length) nut.days[k] = v; });
        nut.weights = Object.assign({}, dn.weights || {}, nut.weights);
        (dn.foods || []).forEach(f => { if (!nut.foods.find(x => x.n === f.n)) nut.foods.push(f); });
        saveNut();
      }
      saveLog(log); saveJSON(LKEY, lifts);
      renderProgress(); document.getElementById("backup-msg").textContent = "Backup restored and merged with what was here.";
    }).catch(() => { msg.textContent = "That file isn't a backup from this app. Pick a workout-backup .json file."; });
  }
  document.getElementById("view-progress").addEventListener("click", e => {
    if (e.target.closest('[data-backup="export"]')) exportBackup();
    const day = e.target.closest("[data-day]");
    if (day) { showView("fuel"); nutDay = day.dataset.day; renderNutrition(); }
  });
  document.getElementById("view-progress").addEventListener("change", e => {
    if (e.target.id === "import-file" && e.target.files[0]) importBackup(e.target.files[0]);
  });

  // ---------- Boot ----------
  renderToday(); renderLibrary(); renderPlan();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  let startView = "today";
  try { startView = sessionStorage.getItem("pr-view") || "today"; } catch (e) {}
  if (views.includes(startView) && startView !== "today") showView(startView);

  // Offline support
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
